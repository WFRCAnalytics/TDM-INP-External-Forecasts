project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    # 1-Get-Historic-AADT.ipynb .. 5-Export-Data.ipynb: the original 5-notebook
    # pipeline. Superseded by index.qmd (see README) -- kept in the repo as
    # archived/historical reference only, excluded from render.
    - "!*.ipynb"
  brand: _extensions/WFRCAnalytics/wfrc-brand/brand.yml

metadata-files:
  - _extensions/WFRCAnalytics/wfrc-brand/wfrc-shared.yml

website:
  title: "External Station Traffic Forecasts"
  site-url: "https://wfrcanalytics.github.io/TDM-INP-External-Forecasts/"
  # Fallback for browsers that ignore prefers-color-scheme on <link rel="icon">
  # (Firefox/Safari); Chrome/Edge get the light/dark swap from the include below.
  favicon: _extensions/WFRCAnalytics/wfrc-brand/assets/logo/abbreviated/WFRC_logo_abbreviated_color_transparent.png

format:
  html:
    include-in-header: assets/favicon-color-scheme.html
